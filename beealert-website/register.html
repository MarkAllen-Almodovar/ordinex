<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bacnotan BEE-Alert — Admin Sign Up</title>
  <link rel="stylesheet" href="src/styles/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="auth-body">

  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <main class="auth-main">
    <div class="auth-card">

      <!-- Orange gradient header -->
      <header class="auth-card__header">
        <div class="auth-card__logo" aria-hidden="true">
          <img src="src/assets/logo.png" alt="BEE-Alert logo" width="56" height="56"
               style="border-radius:50%;object-fit:cover;background:#fff;padding:4px;" />
        </div>
        <h1 class="auth-card__title">Bacnotan BEE-Alert</h1>
        <p class="auth-card__subtitle">Admin Portal</p>
      </header>

      <!-- White card body -->
      <div class="auth-card__body">
        <h2 class="auth-card__welcome">Create Admin Account</h2>
        <p class="auth-card__hint">Register a new official / admin account.</p>

        <!-- Auth-level error banner -->
        <div id="auth-error" class="form-error form-error--block"
             role="alert" aria-live="polite" hidden></div>

        <!-- Success banner -->
        <div id="auth-success" class="form-success form-success--block"
             role="status" aria-live="polite" hidden></div>

        <form id="register-form" novalidate>

          <!-- Full Name -->
          <div class="form-group">
            <label class="form-label" for="name-input">Full Name</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
              </span>
              <input class="form-input" type="text" id="name-input" name="name"
                     autocomplete="name" placeholder="e.g. Juan Dela Cruz"
                     aria-describedby="name-error" aria-required="true" />
            </div>
            <span class="form-error" id="name-error" role="alert" aria-live="polite" hidden></span>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label class="form-label" for="email-input">Email Address</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="4" width="20" height="16" rx="2"/>
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                </svg>
              </span>
              <input class="form-input" type="email" id="email-input" name="email"
                     autocomplete="email" placeholder="official@bacnotan.gov.ph"
                     aria-describedby="email-error" aria-required="true" />
            </div>
            <span class="form-error" id="email-error" role="alert" aria-live="polite" hidden></span>
          </div>

          <!-- Role -->
          <div class="form-group">
            <label class="form-label" for="role-input">Role</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                </svg>
              </span>
              <select class="form-input" id="role-input" name="role"
                      aria-describedby="role-error" aria-required="true"
                      style="cursor:pointer;">
                <option value="">Select a role</option>
                <option value="admin">Admin</option>
                <option value="official">Municipal Official</option>
              </select>
            </div>
            <span class="form-error" id="role-error" role="alert" aria-live="polite" hidden></span>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label class="form-label" for="password-input">Password</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input class="form-input form-input--has-end-icon"
                     type="password" id="password-input" name="password"
                     autocomplete="new-password" placeholder="At least 8 characters"
                     aria-describedby="password-error" aria-required="true" />
              <button type="button" class="input-end-btn" id="toggle-password" aria-label="Show password">
                <svg id="eye-show" width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg id="eye-hide" width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     style="display:none">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
            <span class="form-error" id="password-error" role="alert" aria-live="polite" hidden></span>
          </div>

          <!-- Confirm Password -->
          <div class="form-group">
            <label class="form-label" for="confirm-input">Confirm Password</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input class="form-input" type="password" id="confirm-input" name="confirm"
                     autocomplete="new-password" placeholder="Re-enter your password"
                     aria-describedby="confirm-error" aria-required="true" />
            </div>
            <span class="form-error" id="confirm-error" role="alert" aria-live="polite" hidden></span>
          </div>

          <button class="btn btn--primary btn--full" type="submit" id="register-btn">
            Create Account
          </button>

        </form>

        <p class="auth-card__footer-link">
          Already have an account?
          <a href="/index.html" class="auth-link">Sign In</a>
        </p>

      </div>
    </div>
  </main>

  <div id="loading-overlay" class="loading-overlay" hidden aria-hidden="true">
    <div class="spinner" role="status"><span class="sr-only">Loading&hellip;</span></div>
  </div>

  <script type="module" src="src/auth/register.js"></script>
</body>
</html>
